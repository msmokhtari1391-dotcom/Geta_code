
<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Geta Code</title>
  <style>
:root {
  --font: "Segoe UI Variable Text", "Segoe UI", Tahoma, Arial, sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, "Courier New", monospace;
  --r-lg: 24px;
  --r-md: 16px;
  --r-sm: 12px;
  --accent: #6c8cff;
  --accent-2: #a66bff;
  --accent-3: #22d3ee;
  --ok: #34d399;
  --warn: #fbbf24;
  --err: #f87171;
  --ease: cubic-bezier(.2, .8, .2, 1);
}

[data-theme="dark"] {
  --bg: #0b0d17;
  --text: #eef1ff;
  --muted: rgba(238, 241, 255, .6);
  --glass: rgba(255, 255, 255, .06);
  --glass-strong: rgba(255, 255, 255, .11);
  --stroke: rgba(255, 255, 255, .13);
  --hl: rgba(255, 255, 255, .32);
  --shadow: 0 24px 60px rgba(0, 0, 0, .45), 0 2px 8px rgba(0, 0, 0, .3);
  --input: rgba(0, 0, 0, .24);
  --log-bg: rgba(0, 0, 0, .28);
  --c-accent: #9db0ff;
  --c-ok: #34d399;
  --c-warn: #fbbf24;
  --c-err: #fb8a8a;
  --blob1: #4f46e5;
  --blob2: #c026d3;
  --blob3: #0891b2;
}

[data-theme="light"] {
  --bg: #eef1f8;
  --text: #141827;
  --muted: rgba(20, 24, 39, .58);
  --glass: rgba(255, 255, 255, .42);
  --glass-strong: rgba(255, 255, 255, .68);
  --stroke: rgba(255, 255, 255, .75);
  --hl: rgba(255, 255, 255, .95);
  --shadow: 0 24px 60px rgba(60, 70, 120, .18), 0 2px 8px rgba(60, 70, 120, .1);
  --input: rgba(255, 255, 255, .6);
  --log-bg: rgba(255, 255, 255, .45);
  --c-accent: #4f46e5;
  --c-ok: #059669;
  --c-warn: #b45309;
  --c-err: #dc2626;
  --blob1: #93c5fd;
  --blob2: #f9a8d4;
  --blob3: #99f6e4;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

body {
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.7;
  color: var(--text);
  background: var(--bg);
  overflow: hidden;
  user-select: none;
  -webkit-font-smoothing: antialiased;
  transition: background-color .4s var(--ease), color .4s var(--ease);
}

input, textarea, .log { user-select: text; }
button, input, textarea { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  background:
    radial-gradient(1200px 800px at 85% -10%, color-mix(in srgb, var(--blob1) 35%, transparent), transparent 60%),
    radial-gradient(900px 700px at 0% 110%, color-mix(in srgb, var(--blob2) 28%, transparent), transparent 60%),
    var(--bg);
  transition: background .4s var(--ease);
}

.blob {
  position: absolute;
  width: 46vmax;
  height: 46vmax;
  border-radius: 50%;
  filter: blur(70px);
  opacity: .5;
  will-change: transform;
  animation: float 22s var(--ease) infinite alternate;
}
.b1 { background: var(--blob1); top: -12vmax; right: -8vmax; }
.b2 { background: var(--blob2); bottom: -16vmax; left: -10vmax; animation-duration: 28s; }
.b3 { background: var(--blob3); top: 30%; left: 35%; width: 30vmax; height: 30vmax; opacity: .35; animation-duration: 34s; }
[data-theme="light"] .blob { opacity: .7; }

.sheen {
  position: absolute;
  inset: -50%;
  background: linear-gradient(115deg, transparent 42%, rgba(255, 255, 255, .07) 50%, transparent 58%);
  animation: sheen 16s linear infinite;
}

@keyframes float {
  0%   { transform: translate3d(0, 0, 0) scale(1); }
  50%  { transform: translate3d(4vmax, 3vmax, 0) scale(1.08); }
  100% { transform: translate3d(-3vmax, 5vmax, 0) scale(.95); }
}
@keyframes sheen {
  from { transform: translateX(-30%); }
  to   { transform: translateX(30%); }
}

.app {
  position: relative;
  z-index: 1;
  height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 14px;
  padding: 16px;
}

.glass {
  position: relative;
  background: linear-gradient(135deg, var(--glass-strong), var(--glass));
  backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid var(--stroke);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow), inset 0 1px 0 var(--hl), inset 0 -1px 0 rgba(255, 255, 255, .04);
}
.glass::before {
  content: "";
  position: absolute;
  inset: 0;
  padding: 1px;
  border-radius: inherit;
  background: linear-gradient(135deg, var(--hl), transparent 35%, transparent 65%, rgba(255, 255, 255, .18));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 14px;
  border-radius: 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-inline-end: auto;
}
.logo {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 45%, transparent), inset 0 1px 0 rgba(255, 255, 255, .5);
}
.logo svg { width: 20px; height: 20px; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.3; direction: ltr; text-align: right; }
.brand .sub { font-size: 12px; color: var(--muted); }

.providers { display: flex; gap: 8px; }

.role-grid { display: grid; gap: 8px; }
.role-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.role-row select { min-width: 180px; padding: 6px 8px; border-radius: 8px; background: var(--glass-strong, #1b2030); color: inherit; border: 1px solid var(--stroke, #2a3142); }
.provider {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  border-radius: 999px;
  border: 1px solid var(--stroke);
  background: var(--glass);
  backdrop-filter: blur(12px);
  box-shadow: inset 0 1px 0 var(--hl);
  cursor: pointer;
  transition: transform .2s var(--ease), background .2s, border-color .3s, box-shadow .3s;
}
.provider:hover { transform: translateY(-1px); background: var(--glass-strong); }
.provider:active { transform: scale(.97); }
.provider:disabled { cursor: progress; }
.provider:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pname { font-weight: 600; direction: ltr; }
.pstate { font-size: 11.5px; color: var(--muted); }

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #9ca3af;
  box-shadow: 0 0 0 3px rgba(156, 163, 175, .18);
  transition: background .3s, box-shadow .3s;
}
.provider[data-state="connecting"] .dot {
  background: var(--warn);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 25%, transparent);
  animation: pulse 1s ease-in-out infinite;
}
.provider[data-state="connected"] .dot {
  background: var(--ok);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent), 0 0 10px var(--ok);
}
.provider[data-state="connected"] { border-color: color-mix(in srgb, var(--ok) 50%, var(--stroke)); }
.provider[data-state="connected"] .pstate { color: var(--c-ok); }
.provider[data-state="error"] .dot {
  background: var(--err);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--err) 25%, transparent);
}
.provider[data-state="error"] .pstate { color: var(--c-err); }

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50%      { transform: scale(1.35); opacity: .6; }
}

.icon-btn {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  border: 1px solid var(--stroke);
  background: var(--glass);
  box-shadow: inset 0 1px 0 var(--hl);
  cursor: pointer;
  transition: transform .2s var(--ease), background .2s, color .2s;
}
.icon-btn:hover { background: var(--glass-strong); transform: translateY(-1px); }
.icon-btn:active { transform: scale(.94); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.small { width: 32px; height: 32px; border-radius: 10px; }
.icon-btn.small svg { width: 16px; height: 16px; }
.icon-btn.flash { color: var(--c-ok); }

[data-theme="dark"] .i-moon,
[data-theme="light"] .i-sun { display: none; }

.workspace {
  display: grid;
  grid-template-columns: minmax(360px, 5fr) 7fr;
  gap: 14px;
  min-height: 0;
}

.card {
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 18px;
}
.card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.card-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
.card-head .hint { margin-inline-start: auto; font-size: 12px; color: var(--muted); }
.actions { margin-inline-start: auto; display: flex; align-items: center; gap: 6px; }

form {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field.grow { flex: 1; min-height: 140px; }
.field-label { font-size: 12.5px; font-weight: 600; color: var(--muted); }

input[type="text"],
textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--stroke);
  border-radius: var(--r-sm);
  background: var(--input);
  outline: none;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, .12);
  transition: border-color .2s, box-shadow .2s, background .2s;
}
textarea { flex: 1; min-height: 120px; resize: none; line-height: 1.85; }
input[type="text"]:focus,
textarea:focus {
  border-color: color-mix(in srgb, var(--accent) 70%, transparent);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent);
}
input:disabled, textarea:disabled { opacity: .6; cursor: not-allowed; }
::placeholder { color: var(--muted); opacity: .75; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 999px;
  border: 1px solid var(--stroke);
  background: var(--glass);
  box-shadow: inset 0 1px 0 var(--hl);
  cursor: pointer;
  transition: background .25s var(--ease), color .25s, box-shadow .25s, transform .15s;
}
.chip span svg { width: 15px; height: 15px; }
.chip span:hover { background: var(--glass-strong); }
.chip span:active { transform: scale(.96); }
.chip input:checked + span {
  color: #fff;
  border-color: transparent;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 40%, transparent), inset 0 1px 0 rgba(255, 255, 255, .45);
}
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip input:disabled + span { opacity: .6; cursor: not-allowed; }

.options { display: flex; flex-wrap: wrap; gap: 10px 24px; }
.toggle { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.switch {
  position: relative;
  width: 44px;
  height: 26px;
  flex: none;
  border-radius: 999px;
  border: 1px solid var(--stroke);
  background: color-mix(in srgb, var(--text) 18%, transparent);
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, .2);
  transition: background .25s var(--ease);
}
.switch::after {
  content: "";
  position: absolute;
  top: 2px;
  right: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .3);
  transition: transform .25s var(--ease);
}
.toggle input:checked + .switch { background: var(--ok); }
.toggle input:checked + .switch::after { transform: translateX(-18px); }
.toggle input:focus-visible + .switch { outline: 2px solid var(--accent); outline-offset: 2px; }
.toggle input:disabled + .switch { opacity: .6; }

.build-btn {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 14px 18px;
  border: 0;
  border-radius: 16px;
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  background-size: 200% 200%;
  box-shadow: 0 10px 28px color-mix(in srgb, var(--accent) 40%, transparent),
              inset 0 1px 0 rgba(255, 255, 255, .45),
              inset 0 -2px 6px rgba(0, 0, 0, .15);
  transition: transform .2s var(--ease), box-shadow .3s var(--ease);
}
.build-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255, 255, 255, .28), transparent 55%);
  pointer-events: none;
}
.build-btn::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  right: -60%;
  width: 40%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .45), transparent);
  transform: skewX(-20deg);
  transition: right .7s var(--ease);
  pointer-events: none;
}
.build-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 16px 38px color-mix(in srgb, var(--accent-2) 50%, transparent),
              inset 0 1px 0 rgba(255, 255, 255, .5),
              inset 0 -2px 6px rgba(0, 0, 0, .15);
}
.build-btn:hover:not(:disabled)::after { right: 120%; }
.build-btn:active:not(:disabled) { transform: scale(.985); }
.build-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.build-btn .label { position: relative; }

.spinner {
  display: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .35);
  border-top-color: #fff;
  animation: spin .8s linear infinite;
}

.build-btn.is-busy {
  cursor: progress;
  background-image: linear-gradient(120deg, var(--accent), var(--accent-2), var(--accent-3), var(--accent));
  animation: flow 3s linear infinite, glow 1.6s ease-in-out infinite;
}
.build-btn.is-busy .spinner { display: block; }
.build-btn.is-busy::after { animation: shimmer 1.6s linear infinite; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes flow { to { background-position: 200% 0; } }
@keyframes shimmer { from { right: -60%; } to { right: 120%; } }
@keyframes glow {
  0%, 100% { box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 55%, transparent), 0 0 0 0 color-mix(in srgb, var(--accent) 35%, transparent); }
  50%      { box-shadow: 0 0 40px color-mix(in srgb, var(--accent-2) 75%, transparent), 0 0 0 6px color-mix(in srgb, var(--accent-2) 0%, transparent); }
}

.form-msg { min-height: 1.4em; margin: -4px 0 0; font-size: 12.5px; color: var(--muted); }
.form-msg[data-type="err"] { color: var(--c-err); }
.form-msg[data-type="ok"] { color: var(--c-ok); }

.logs .card-head { margin-bottom: 10px; }
.badge {
  padding: 2px 10px;
  border-radius: 999px;
  border: 1px solid var(--stroke);
  background: var(--glass-strong);
  color: var(--muted);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
}

.log {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 10px;
  border-radius: var(--r-md);
  border: 1px solid var(--stroke);
  background: var(--log-bg);
  box-shadow: inset 0 2px 10px rgba(0, 0, 0, .15);
  font-family: var(--mono), var(--font);
  font-size: 12.8px;
  line-height: 1.75;
}

.log-line {
  display: flex;
  gap: 10px;
  padding: 2px 8px;
  border-radius: 8px;
  white-space: pre-wrap;
  word-break: break-word;
  animation: lineIn .35s var(--ease) both;
}
.log-line:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
.log-line .t { flex: none; padding-top: 1px; font-size: 11.5px; color: var(--muted); opacity: .75; direction: ltr; }
.log-line .m { flex: 1; unicode-bidi: plaintext; text-align: start; }
.log-line.step .m { color: var(--c-accent); font-weight: 600; }
.log-line.ok .m { color: var(--c-ok); }
.log-line.warn .m { color: var(--c-warn); }
.log-line.err { background: color-mix(in srgb, var(--err) 10%, transparent); }
.log-line.err .m { color: var(--c-err); }

@keyframes lineIn {
  from { opacity: 0; transform: translate3d(0, 6px, 0); }
  to   { opacity: 1; transform: none; filter: none; }
}

.log-empty {
  height: 100%;
  display: grid;
  place-items: center;
  text-align: center;
  color: var(--muted);
  font-family: var(--font);
  font-size: 13px;
}

.statusbar {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 8px;
  font-size: 12px;
  color: var(--muted);
}
.backend { display: inline-flex; align-items: center; gap: 8px; }
.sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); animation: pulse 1.4s ease-in-out infinite; }
.sdot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: none; }
.timer { font-variant-numeric: tabular-nums; }
.shortcut { margin-inline-start: auto; }
kbd {
  display: inline-block;
  padding: 0 6px;
  margin: 0 2px;
  border-radius: 6px;
  border: 1px solid var(--stroke);
  background: var(--glass-strong);
  font-family: var(--font);
  font-size: 11px;
  direction: ltr;
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  border: 3px solid transparent;
  border-radius: 999px;
  background: color-mix(in srgb, var(--text) 22%, transparent);
  background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--text) 35%, transparent); }

@media (max-width: 980px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100vh; }
  .workspace { grid-template-columns: 1fr; }
  .log { min-height: 320px; }
  .topbar { flex-wrap: wrap; }
  .brand .sub, .shortcut { display: none; }
}
@media (max-width: 640px) {
  .pstate { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

</style>

<script>
(function () {
  'use strict';
  if (window.pywebview && window.pywebview.api) return;

  const methods = [
    'open_dev', 'login', 'cancel_login', 'pick_folder', 'scan_folder',
    'start_build', 'stop_build', 'open_path', 'reveal_path',
    'list_replies', 'read_reply'
  ];

  const apiProxy = {};
  for (const m of methods) {
    apiProxy[m] = async function (...args) {
      const res = await fetch('/api/' + m, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ args })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    };
  }

  window.pywebview = { api: apiProxy };

  // دریافت لحظه‌ای لاگ‌ها و دستورات جاوااسکریپت از پایتون از طریق SSE / Polling سبک
  let lastSeq = 0;
  async function pollEvents() {
    try {
      const res = await fetch('/events?since=' + lastSeq);
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data.events)) {
          for (const ev of data.events) {
            lastSeq = Math.max(lastSeq, ev.seq || 0);
            try { (0, eval)(ev.code); } catch (e) { console.error(e); }
          }
        }
      }
    } catch (_) {}
    setTimeout(pollEvents, 350);
  }

  window.addEventListener('DOMContentLoaded', () => {
    window.dispatchEvent(new Event('pywebviewready'));
    pollEvents();
  });
})();
</script>

    <main class="workspace">
      <section class="card glass request">
        <div class="card-head">
          <h2>درخواست جدید</h2>
          <span class="hint">پروژه‌ات را توصیف کن؛ بقیه با تیم است</span>
        </div>

        <form id="buildForm" autocomplete="off" novalidate>
      <div class="ws-card" id="wsCard" data-mode="new">
        <div class="ws-row">
          <button type="button" class="ws-pick" id="wsPick"><span>انتخاب پوشه</span></button>
          <div class="ws-path" id="wsPath">پوشه‌ای انتخاب نشده</div>
          <button type="button" class="ws-clear" id="wsClear" title="حذف انتخاب" hidden>×</button>
        </div>
        <div class="ws-modes" role="radiogroup">
          <button type="button" class="ws-mode active" data-mode="new" role="radio" aria-checked="true">ساخت جدید</button>
          <button type="button" class="ws-mode" id="wsModeEdit" data-mode="edit" role="radio" aria-checked="false" disabled>ویرایش فایل‌ها</button>
          <button type="button" class="ws-mode" id="wsModeResume" data-mode="resume" role="radio" aria-checked="false" disabled>ادامه کار نیمه‌تمام</button>
        </div>
        <div class="ws-info" id="wsInfo"></div>
      </div>

          <label class="field">
            <span class="field-label">نام پروژه</span>
            <input type="text" id="projectName" dir="auto" maxlength="60" placeholder="مثلاً calculator_app" spellcheck="false">
          </label>

          <label class="field grow">
            <span class="field-label">توضیح پروژه</span>
            <textarea id="task" dir="auto" placeholder="مثلاً: یک ماشین حساب گرافیکی با tkinter بساز که چهار عمل اصلی، پاک کردن و تاریخچه داشته باشد."></textarea>
          </label>

          <div class="field">
            <span class="field-label">نقش‌ها و سرویس هر نقش</span>
            <div class="role-grid">
              <label class="role-row"><span>معمار</span><select name="roleSel" data-role="architect"></select></label>
              <label class="role-row"><span>کدنویس</span><select name="roleSel" data-role="coder"></select></label>
              <label class="role-row"><span>بازبین</span><select name="roleSel" data-role="reviewer"></select></label>
              <label class="role-row"><span>هماهنگ‌کننده</span><select name="roleSel" data-role="orchestrator"></select></label>
            </div>
          </div>

          <div class="options">
            <label class="toggle">
              <input type="checkbox" id="makeExe">
              <span class="switch"></span>
              <span>فایل exe بساز</span>
            </label>
            <label class="toggle">
              <input type="checkbox" id="autoRun">
              <span class="switch"></span>
              <span>بعد از ساخت اجرا کن</span>
            </label>
            <label class="toggle">
              <input type="checkbox" id="keepAwake" checked>
              <span class="switch"></span>
              <span>هنگام ساخت صفحه روشن بماند</span>
            </label>
          </div>

          <button type="submit" id="buildBtn" class="build-btn" data-geta="build">
            <span class="spinner" aria-hidden="true"></span>
            <span class="label">ساخت پروژه</span>
          </button>
          <p id="formMsg" class="form-msg" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="card glass logs">
        <div class="card-head">
          <h2>لاگ زنده</h2>
          <div class="actions">
            <span id="logCount" class="badge" title="تعداد خطوط">۰</span>
            <button type="button" id="copyLog" class="icon-btn small" title="کپی لاگ" aria-label="کپی لاگ">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            </button>
            <button type="button" id="clearLog" class="icon-btn small" title="پاک کردن لاگ" aria-label="پاک کردن لاگ">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
            </button>
          </div>
        </div>
        <div id="log" class="log" data-geta="log" role="log" aria-live="polite">
          <div class="log-empty">هنوز لاگی ثبت نشده است.<br>بعد از شروع ساخت، مراحل کار اینجا نمایش داده می‌شود.</div>
        </div>
      </section>
    </main>

    <footer class="statusbar">
      <span class="backend"><span id="backendDot" class="sdot"></span><span id="backendText">در انتظار بک‌اند پایتون…</span></span>
      <span id="buildTimer" class="timer"></span>
      <span class="shortcut"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> برای ساخت</span>
    </footer>
  </div>

  <script>
(function () {
  'use strict';

  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));

  const els = {
    form: $('#buildForm'),
    task: $('#task'),
    name: $('#projectName'),
    makeExe: $('#makeExe'),
    autoRun: $('#autoRun'),
    keepAwake: $('#keepAwake'),
    buildBtn: $('#buildBtn'),
    btnLabel: $('#buildBtn .label'),
    formMsg: $('#formMsg'),
    log: $('#log'),
    logCount: $('#logCount'),
    copyLog: $('#copyLog'),
    clearLog: $('#clearLog'),
    themeToggle: $('#themeToggle'),
    backendDot: $('#backendDot'),
    backendText: $('#backendText'),
    timer: $('#buildTimer')
  };

  const PROVIDER_NAMES = { deepseek: 'DeepSeek', chatgpt: 'ChatGPT', gemini: 'Gemini', claude: 'Claude', qwen: 'Qwen', glm: 'GLM', kimi: 'Kimi' };
  const ROLE_NAMES = { architect: 'معمار', coder: 'کدنویس', reviewer: 'بازبین', orchestrator: 'هماهنگ‌کننده' };
  const STATE_TEXT = { idle: 'متصل نیست', connecting: 'در حال اتصال…', connected: 'متصل', error: 'خطا' };
  const MAX_LINES = 3000;
  const EMPTY_LOG_HTML = els.log.innerHTML;

  const THEME_KEY = 'geta-theme';

  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem(THEME_KEY, theme); } catch (_) { /* ignore */ }
  }

  (function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (_) { saved = null; }
    const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
    applyTheme(saved === 'light' || saved === 'dark' ? saved : (prefersLight ? 'light' : 'dark'));
  })();

  els.themeToggle.addEventListener('click', () => {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  });
  const devBtn = document.getElementById('openDevBtn');
  if (devBtn) {
    devBtn.addEventListener('click', async () => {
      const api = getApi();
      if (api && typeof api.open_dev === 'function') {
        await api.open_dev();
      }
    });
  }

  function getApi() {
    return (window.pywebview && window.pywebview.api) ? window.pywebview.api : null;
  }

  function setBackendStatus(ok) {
    els.backendDot.classList.toggle('on', ok);
    els.backendText.textContent = ok ? 'بک‌اند پایتون متصل است' : 'در انتظار بک‌اند پایتون…';
  }

  window.addEventListener('pywebviewready', () => setBackendStatus(true));
  setBackendStatus(!!getApi());

  function isSuccess(res) {
    if (res === undefined || res === null) return true;
    if (typeof res === 'object') return res.ok !== false && res.success !== false && !res.error;
    return res !== false;
  }

  function errText(err) {
    return (err && err.message) ? err.message : String(err);
  }

  const queue = [];
  let flushScheduled = false;
  let lineCount = 0;

  function classify(text) {
    if (/(traceback|exception|error|failed|خطا|ناموفق)/i.test(text)) return 'err';
    if (/(warn|هشدار)/i.test(text)) return 'warn';
    if (/(success|done|completed|✔|✓|موفق|انجام شد|ساخته شد|تمام شد|به پایان رسید)/i.test(text)) return 'ok';
    if (/^\s*(\[[^\]]{1,30}\]|>>|==>|#{1,3}\s|---)/.test(text)) return 'step';
    return 'info';
  }

  function timeNow() {
    return new Date().toLocaleTimeString('en-GB', { hour12: false });
  }

  function isNearBottom() {
    const l = els.log;
    return l.scrollHeight - l.scrollTop - l.clientHeight < 40;
  }

  function flushLog() {
    flushScheduled = false;
    if (!queue.length) return;

    const stick = isNearBottom();
    const empty = els.log.querySelector('.log-empty');
    if (empty) empty.remove();

    const frag = document.createDocumentFragment();
    for (const item of queue.splice(0)) {
      const row = document.createElement('div');
      row.className = 'log-line ' + classify(item.text);

      const ts = document.createElement('span');
      ts.className = 't';
      ts.textContent = item.time;

      const msg = document.createElement('span');
      msg.className = 'm';
      msg.textContent = item.text;

      row.append(ts, msg);
      frag.appendChild(row);
      lineCount++;
    }
    els.log.appendChild(frag);

    while (els.log.childElementCount > MAX_LINES) {
      els.log.firstElementChild.remove();
    }

    els.logCount.textContent = lineCount.toLocaleString('fa-IR');
    if (stick) els.log.scrollTop = els.log.scrollHeight;
  }

  window.appendLog = function (line) {
    if (line === undefined || line === null) return;
    const time = timeNow();
    String(line).replace(/\r\n?/g, '\n').split('\n').forEach((part) => {
      if (part.trim() !== '') queue.push({ text: part, time });
    });
    if (!flushScheduled) {
      flushScheduled = true;
      requestAnimationFrame(flushLog);
    }
  };

  els.clearLog.addEventListener('click', () => {
    queue.length = 0;
    lineCount = 0;
    els.log.innerHTML = EMPTY_LOG_HTML;
    els.logCount.textContent = (0).toLocaleString('fa-IR');
  });

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (_) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    }
  }

  els.copyLog.addEventListener('click', async () => {
    const text = $$('.log-line')
      .map((row) => row.querySelector('.t').textContent + '  ' + row.querySelector('.m').textContent)
      .join('\n');
    if (!text) return;
    if (await copyText(text)) {
      els.copyLog.classList.add('flash');
      setTimeout(() => els.copyLog.classList.remove('flash'), 900);
    }
  });

  function setProviderStatus(provider, state) {
    const btn = document.querySelector(`.provider[data-provider="${provider}"]`);
    if (!btn) return;
    if (!STATE_TEXT[state]) state = 'idle';
    btn.dataset.state = state;
    btn.querySelector('.pstate').textContent = STATE_TEXT[state];
    btn.disabled = state === 'connecting';
    btn.title = `${PROVIDER_NAMES[provider] || provider}: ${STATE_TEXT[state]}`;
  }
  window.setProviderStatus = setProviderStatus;

  async function login(provider) {
    const label = PROVIDER_NAMES[provider] || provider;
    const api = getApi();
    if (!api || typeof api.login !== 'function') {
      setProviderStatus(provider, 'error');
      window.appendLog('[UI] خطا: بک‌اند پایتون در دسترس نیست (window.pywebview.api).');
      return;
    }

    setProviderStatus(provider, 'connecting');
    window.appendLog(`[UI] ورود به ${label}…`);
    try {
      const res = await api.login(provider);
      const ok = isSuccess(res);
      setProviderStatus(provider, ok ? 'connected' : 'error');
      window.appendLog(ok
        ? `[UI] ورود به ${label} انجام شد.`
        : `[UI] خطا در ورود به ${label}${res && res.error ? ': ' + res.error : ''}`);
    } catch (err) {
      setProviderStatus(provider, 'error');
      window.appendLog(`[UI] خطا در ورود به ${label}: ${errText(err)}`);
    }
  }

  $$('.provider[data-provider]').forEach((btn) => {
    setProviderStatus(btn.dataset.provider, 'idle');
    btn.addEventListener('click', () => login(btn.dataset.provider));
  });

  let building = false;
  let timerId = null;
  let startedAt = 0;

  function updateTimer() {
    const s = Math.floor((Date.now() - startedAt) / 1000);
    const mm = String(Math.floor(s / 60)).padStart(2, '0');
    const ss = String(s % 60).padStart(2, '0');
    els.timer.textContent = `زمان ساخت: ${mm}:${ss}`;
  }

  function setBuilding(on) {
    building = !!on;
    els.buildBtn.classList.toggle('is-busy', building);
    els.buildBtn.disabled = building;
    els.btnLabel.textContent = building ? 'در حال ساخت…' : 'ساخت پروژه';
    els.form.querySelectorAll('input, textarea').forEach((el) => { el.disabled = building; });

    clearInterval(timerId);
    timerId = null;
    if (building) {
      startedAt = Date.now();
      updateTimer();
      timerId = setInterval(updateTimer, 1000);
    }
  }
  window.setBuilding = setBuilding;

  function showMsg(text, type) {
    els.formMsg.textContent = text || '';
    els.formMsg.dataset.type = type || '';
  }

  function sanitizeName(raw) {
    return raw
      .trim()
      .replace(/[<>:"/\\|?*\u0000-\u001f]/g, '')
      .replace(/\s+/g, '_')
      .replace(/[. ]+$/, '');
  }

  els.form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (building) return;

    const task = els.task.value.trim();
    const name = sanitizeName(els.name.value);
    const roles = {};
    document.querySelectorAll('select[name="roleSel"]').forEach((sel) => { roles[sel.dataset.role] = sel.value; });
    const makeExe = els.makeExe.checked;
    const autoRun = els.autoRun.checked;
    const keepAwake = els.keepAwake ? els.keepAwake.checked : true;

    if (!name) { showMsg('لطفاً نام پروژه را وارد کنید.', 'err'); els.name.focus(); return; }
    if (!task) { showMsg('لطفاً توضیح پروژه را بنویسید.', 'err'); els.task.focus(); return; }

    const api = getApi();
    if (!api || typeof api.start_build !== 'function') {
      showMsg('بک‌اند پایتون در دسترس نیست.', 'err');
      return;
    }

    els.name.value = name;
    showMsg('');
    setBuilding(true);
    window.appendLog(`[UI] شروع ساخت «${name}» | نقش‌ها: ${Object.entries(roles).map(([r, v]) => (ROLE_NAMES[r] || r) + ': ' + v).join('، ')}`);

    let keepBusy = false;
    try {
      const res = await api.start_build(task, name, roles, makeExe, autoRun, keepAwake);
      if (res && typeof res === 'object' && res.running === true) {
        keepBusy = true;
        showMsg('ساخت در پس‌زمینه در حال اجراست…', 'ok');
      } else if (isSuccess(res)) {
        showMsg(res && res.message ? res.message : 'ساخت پروژه به پایان رسید.', 'ok');
      } else {
        showMsg('ساخت ناموفق بود' + (res && res.error ? ': ' + res.error : '.'), 'err');
      }
    } catch (err) {
      showMsg('خطا: ' + errText(err), 'err');
      window.appendLog('[UI] خطا در start_build: ' + errText(err));
    } finally {
      if (!keepBusy) setBuilding(false);
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'Enter') {
      e.preventDefault();
      if (!building) els.form.requestSubmit();
    }
  });
})();

</script>
<script>
(() => {
  'use strict';
  const S = { folder: null, mode: 'new', info: null };
  const el = id => document.getElementById(id);
  const api = () => (window.pywebview && window.pywebview.api) || null;
  const log = t => window.appendLog && window.appendLog(t);
  const short = p => (p.length > 64 ? '…' + p.slice(-62) : p);

  function fillTask(text) {
    const ta = document.querySelector('textarea');
    if (!ta || !text || ta.value.trim()) return;
    ta.value = text;
    ta.dispatchEvent(new Event('input', { bubbles: true }));
  }

  function renderInfo() {
    const box = el('wsInfo'), i = S.info;
    box.className = 'ws-info';
    if (!S.folder || !i) {
      box.textContent = 'بدون انتخاب پوشه، پروژه در projects/نام‌پروژه ساخته می‌شود.';
      return;
    }
    const cp = i.checkpoint;
    let t = `${i.files} فایل در پوشه`;
    if (cp && cp.status !== 'done') {
      t += cp.total ? ` · کار نیمه‌تمام: ${cp.done} از ${cp.total} فایل` : ' · کار در مرحله‌ی برنامه‌ریزی متوقف شده';
      if (cp.error) t += ` — آخرین خطا: ${cp.error}`;
      box.classList.add('warn');
    } else if (cp) {
      t += ' · آخرین ساخت کامل شده';
    }
    if (S.mode === 'edit') t += ' · فایل‌های موجود تغییر می‌کنند (نسخه‌ی قبلی در .geta/backups)';
    if (S.mode === 'new' && i.files) t += ' · فایل‌های هم‌نام بازنویسی می‌شوند (با بکاپ)';
    box.textContent = t;
  }

  function setMode(mode) {
    const btn = document.querySelector(`.ws-mode[data-mode="${mode}"]`);
    if (!btn || btn.disabled) mode = 'new';
    S.mode = mode;
    document.querySelectorAll('.ws-mode').forEach(b => {
      const on = b.dataset.mode === mode;
      b.classList.toggle('active', on);
      b.setAttribute('aria-checked', String(on));
    });
    el('wsCard').dataset.mode = mode;
    if (mode === 'resume' && S.info && S.info.checkpoint) fillTask(S.info.checkpoint.task);
    renderInfo();
  }

  function apply(info) {
    if (!info) return;
    if (!info.ok) { log('✗ خطا: ' + (info.error || 'پوشه نامعتبر است')); return; }
    S.folder = info.path;
    S.info = info;
    const p = el('wsPath');
    p.textContent = short(info.path);
    p.title = info.path;
    p.classList.add('set');
    el('wsClear').hidden = false;
    const cp = info.checkpoint;
    const unfinished = !!(cp && cp.status !== 'done');
    el('wsModeEdit').disabled = info.files === 0;
    el('wsModeResume').disabled = !unfinished;
    setMode(unfinished ? 'resume' : S.mode);
  }

  function clear() {
    S.folder = null; S.info = null;
    const p = el('wsPath');
    p.textContent = 'پوشه‌ای انتخاب نشده';
    p.title = '';
    p.classList.remove('set');
    el('wsClear').hidden = true;
    el('wsModeEdit').disabled = true;
    el('wsModeResume').disabled = true;
    setMode('new');
  }

  async function pick() {
    const a = api();
    if (!a) return;
    try { apply(await a.pick_folder()); } catch (e) { log('✗ خطا در انتخاب پوشه: ' + e); }
  }

  async function rescan() {
    const a = api();
    if (!a || !S.folder) return;
    try { apply(await a.scan_folder(S.folder)); } catch (_) { }
  }

  function wrapApi() {
    const a = api();
    if (!a || typeof a.start_build !== 'function' || a.start_build.__geta) return;
    const orig = a.start_build;
    const wrapped = (task, name, roles, makeExe, autoRun, keepAwake) =>
      orig.call(a, task, name, roles, makeExe, autoRun, S.folder, S.mode, keepAwake);
    wrapped.__geta = true;
    a.start_build = wrapped;
  }

  const prevSetBuilding = window.setBuilding;
  window.setBuilding = function (busy) {
    const r = typeof prevSetBuilding === 'function' ? prevSetBuilding.apply(this, arguments) : undefined;
    el('wsCard').classList.toggle('locked', !!busy);
    if (!busy) setTimeout(rescan, 300);
    return r;
  };

  window.getWorkspace = () => ({ folder: S.folder, mode: S.mode });

  el('wsPick').addEventListener('click', pick);
  el('wsClear').addEventListener('click', clear);
  document.querySelectorAll('.ws-mode').forEach(b =>
    b.addEventListener('click', () => !b.disabled && setMode(b.dataset.mode)));
  window.addEventListener('pywebviewready', wrapApi);
  wrapApi();
  renderInfo();
})();

</script>

  const api = () => (window.pywebview && window.pywebview.api) || null;
  const restart = (el, cls) => { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
  const topLevel = list => list.filter(el => !list.some(o => o !== el && o.contains(el)));
  const relative = el => { if (getComputedStyle(el).position === 'static') el.style.position = 'relative'; };
  let busyNow = false;

  function splash() {
    if (RM) return 0;
    const d = document.createElement('div');
    d.className = 'g-splash';
    d.innerHTML = `<div class="g-splash-glow"></div><div class="g-splash-ring"></div>
      <img class="g-splash-logo" decoding="async" src="${FULL}" alt="GetaCode"><div class="g-splash-bar"><i></i></div>`;
    document.body.appendChild(d);
    requestAnimationFrame(() => {
      setTimeout(() => d.classList.add('out'), 850);
      setTimeout(() => d.remove(), 1320);
    });
    return 650;
  }

  function brand() {
    const b = $('[data-geta="brand"]');
    if (b) {
      b.innerHTML = `<img class="g-logo" src="${MARK}" alt="GetaCode" draggable="false">`;
      b.classList.add('g-brand');
    }
    let link = $('link[rel="icon"]');
    if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
    link.href = MARK;
    const log = $('[data-geta="log"]');
    const host = log && log.parentElement;
    if (host && !$('.g-watermark', host)) {
      relative(host);
      host.classList.add('g-watermark-host');
      const w = document.createElement('img');
      w.className = 'g-watermark'; w.src = MARK; w.alt = '';
      host.prepend(w);
    }
  }

  function entrance(base) {
    if (RM) return;
    topLevel($$('header, section, aside')).forEach((el, i) => {
      el.style.setProperty('--g-d', `${base + i * 120}ms`);
      el.classList.add('g-enter');
      el.addEventListener('animationend', () => el.classList.remove('g-enter'), { once: true });
    });
  }

  function spotlight() {
    if (RM) return;
    topLevel($$('section, aside')).forEach(el => {
      relative(el);
      el.classList.add('g-spot-host');
      const s = document.createElement('div');
      s.className = 'g-spot';
      el.appendChild(s);
      el.addEventListener('pointermove', e => {
        const r = el.getBoundingClientRect();
        s.style.setProperty('--mx', `${e.clientX - r.left}px`);
        s.style.setProperty('--my', `${e.clientY - r.top}px`);
      }, { passive: true });
    });
  }

  function ripple() {
    document.addEventListener('pointerdown', e => {
      const b = e.target.closest('button, [role="button"], .chip');
      if (!b || b.disabled || RM) return;
      relative(b);
      let wrap = b.querySelector(':scope > .g-rip-wrap');
      if (!wrap) { wrap = document.createElement('span'); wrap.className = 'g-rip-wrap'; b.appendChild(wrap); }
      const r = b.getBoundingClientRect();
      const size = Math.max(r.width, r.height) * 2.2;
      const dot = document.createElement('span');
      dot.className = 'g-rip';
      dot.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left - size / 2}px;top:${e.clientY - r.top - size / 2}px`;
      wrap.appendChild(dot);
      setTimeout(() => dot.remove(), 700);
      restart(b, 'g-press');
    }, { passive: true });
  }

  const RULES = [
    [/⏹|متوقف شد|stopped/i, 'g-ln-stop'],
    [/✗|خطا|error|failed|exception/i, 'g-ln-err'],
    [/⚠|⏸|صبر|انتظار|محدودیت|limit|retry/i, 'g-ln-warn'],
    [/✓|✔|انجام شد|ساخته شد|ویرایش شد|آماده شد|success/i, 'g-ln-ok'],
  ];
  let variant = 0;
  function classify(text) {
    for (const [re, cls] of RULES) if (re.test(text)) return cls;
    variant = (variant + 1) % 3;
    return `g-ln-in${variant + 1}`;
  }
  function logLines() {
    const log = $('[data-geta="log"]');
    if (!log || RM) return;
    new MutationObserver(muts => {
      for (const m of muts) {
        for (const n of m.addedNodes) {
          if (n.nodeType !== 1 || n.classList.contains('g-watermark')) continue;
          const cls = classify(n.textContent || '');
          n.classList.add('g-ln', cls);
          if (cls === 'g-ln-err') restart($('[data-geta="brand"]'), 'g-ping-err');
        }
      }
    }).observe(log, { childList: true });
  }

  function burst(el, color) {
    if (RM || !el) return;
    const r = el.getBoundingClientRect();
    for (let i = 0; i < 26; i++) {
      const p = document.createElement('i');
      const ang = Math.random() * Math.PI * 2;
      const dist = 60 + Math.random() * 130;
      p.className = 'g-spark';
      p.style.left = `${r.left + r.width / 2 + (Math.random() - 0.5) * r.width * 0.6}px`;
      p.style.top = `${r.top + r.height / 2}px`;
      p.style.setProperty('--tx', `${Math.cos(ang) * dist}px`);
      p.style.setProperty('--ty', `${Math.sin(ang) * dist}px`);
      p.style.background = color;
      p.style.color = color;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 950);
    }
  }
  function toast(text, type = 'info') {
    let wrap = $('.g-toasts');
    if (!wrap) { wrap = document.createElement('div'); wrap.className = 'g-toasts'; document.body.appendChild(wrap); }
    const t = document.createElement('div');
    t.className = `g-toast ${type}`;
    t.innerHTML = `<img src="${MARK}" alt=""><span></span>`;
    t.querySelector('span').textContent = text;
    wrap.appendChild(t);
    setTimeout(() => t.classList.add('out'), 3800);
    setTimeout(() => t.remove(), 4400);
  }

  const buildBtn = () => $('[data-geta="build"]');
  function ensureScan(b) {
    if (b && !$('.g-scan', b)) { const s = document.createElement('span'); s.className = 'g-scan'; b.appendChild(s); }
  }
  function mountStop() {
    const b = buildBtn();
    if (!b || $('#gStop')) return;
    ensureScan(b);
    const s = document.createElement('button');
    s.type = 'button'; s.id = 'gStop'; s.className = 'g-stop'; s.hidden = true;
    s.innerHTML = '<span class="g-stop-ico"></span><span class="g-stop-txt">توقف ساخت</span><kbd>Esc</kbd>';
    b.insertAdjacentElement('afterend', s);
    s.addEventListener('click', requestStop);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !s.hidden && !s.disabled) requestStop();
    });
  }
  async function requestStop() {
    const s = $('#gStop');
    const a = api();
    if (!s || !a || typeof a.stop_build !== 'function') return;
    s.disabled = true;
    s.classList.add('stopping');
    $('.g-stop-txt', s).textContent = 'در حال توقف… (کار ذخیره می‌شود)';
    try { await a.stop_build(); } catch (_) {
      s.disabled = false; s.classList.remove('stopping'); $('.g-stop-txt', s).textContent = 'توقف ساخت';
    }
  }
  function setBusy(busy) {
    busy = !!busy;
    if (busy === busyNow) return;
    busyNow = busy;
    document.body.classList.toggle('g-busy', busy);
    const b = buildBtn();
    if (b) { ensureScan(b); b.classList.toggle('g-building', busy); }
    const s = $('#gStop');
    if (s) {
      s.hidden = !busy;
      s.disabled = false;
      s.classList.remove('stopping');
      $('.g-stop-txt', s).textContent = 'توقف ساخت';
      if (busy) restart(s, 'g-pop');
    }
  }

  function wrapApi() {
    const a = api();
    if (!a || typeof a.start_build !== 'function' || a.start_build.__gm) return;
    const orig = a.start_build;
    const w = function (...args) {
      setBusy(true);
      return Promise.resolve(orig.apply(a, args)).then(
        res => { if (res && res.ok === false) setBusy(false); return res; },
        err => { setBusy(false); throw err; });
    };
    w.__gm = true;
    w.__geta = orig.__geta;
    a.start_build = w;
  }
  function hooks() {
    const prevSB = window.setBuilding;
    window.setBuilding = function (busy) {
      const r = typeof prevSB === 'function' ? prevSB.apply(this, arguments) : undefined;
      setBusy(busy);
      return r;
    };
    const prevFin = window.finishProgress;
    window.finishProgress = function (ok) {
      const r = typeof prevFin === 'function' ? prevFin.apply(this, arguments) : undefined;
      const b = buildBtn();
      if (ok) { burst(b, '#ff3b3b'); burst(b, '#ffd2c4'); toast('ساخت کامل شد', 'ok'); }
      else { restart(b, 'g-shake'); toast('ساخت متوقف شد؛ وضعیت ذخیره شده و قابل ادامه است', 'warn'); }
      return r;
    };
    wrapApi();
    window.addEventListener('pywebviewready', wrapApi);
  }

  function embers() {
    if (RM) return;
    const c = document.createElement('canvas');
    c.className = 'g-embers';
    document.body.appendChild(c);
    const ctx = c.getContext('2d');
    let W = 0, H = 0;
    const resize = () => { W = c.width = innerWidth; H = c.height = innerHeight; };
    const make = fresh => ({
      x: Math.random() * W, y: fresh ? Math.random() * H : H + Math.random() * 40,
      r: Math.random() * 1.8 + 0.5, vy: Math.random() * 0.45 + 0.15, vx: (Math.random() - 0.5) * 0.25,
      a: Math.random() * 0.6 + 0.25, t: Math.random() * 6.28, g: 60 + Math.random() * 70,
    });
    resize();
    const P = Array.from({ length: 18 }, () => make(true));
    addEventListener('resize', resize);
    function frame() {
      if (document.hidden) return;
      const speed = document.body.classList.contains('g-busy') ? 2.4 : 1;
      ctx.clearRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < P.length; i++) {
        const p = P[i];
        p.t += 0.02 * speed;
        p.y -= p.vy * speed;
        p.x += (p.vx + Math.sin(p.t) * 0.2) * speed;
        const fade = Math.min(1, p.y / (H * 0.35));
        if (p.y < -10 || fade <= 0) { P[i] = make(false); continue; }
        ctx.fillStyle = `rgba(255,${p.g},40,${p.a * fade * 0.25})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 4, 0, 6.283); ctx.fill();
        ctx.fillStyle = `rgba(255,${p.g + 60},90,${p.a * fade})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      }
      requestAnimationFrame(frame);
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) requestAnimationFrame(frame); });
    requestAnimationFrame(frame);
  }

  function init() {
    const base = splash();
    brand();
    mountStop();
    hooks();
    ripple();
    logLines();
    spotlight();
    entrance(base);
    embers();
  }

  window.gToast = toast;
  window.gBurst = burst;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
<script>
(() => {
  'use strict';
  const style = document.createElement('style');
  style.textContent = `
.g-out{position:fixed;left:24px;bottom:24px;z-index:9000;width:min(460px,calc(100vw - 48px));padding:16px;border-radius:18px;
  color:#fff;background:rgba(16,5,6,.86);border:1px solid rgba(255,43,43,.45);backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 30px rgba(255,43,43,.18);
  animation:g-out-in .55s cubic-bezier(.2,.9,.2,1) both}
.g-out.out{animation:g-out-out .4s ease forwards}
.g-out-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.g-out-head img{width:42px;height:42px;border-radius:12px;box-shadow:0 0 16px rgba(255,43,43,.45)}
.g-out-head b{display:block;font-size:15px}
.g-out-head small{display:block;opacity:.7;font-size:12px;margin-top:2px}
.g-out-path{padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.06);font:12.5px/1.6 Consolas,"Cascadia Mono",monospace;
  word-break:break-all;user-select:text;text-align:left;margin-bottom:12px}
.g-out-btns{display:flex;gap:8px;flex-wrap:wrap}
.g-out-btns button{flex:1;min-width:110px;padding:9px 12px;border-radius:11px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:13px;cursor:pointer;transition:background .2s,transform .2s}
.g-out-btns button:hover{background:rgba(255,255,255,.12)}
.g-out-btns button:active{transform:scale(.96)}
.g-out-btns .g-out-open{background:linear-gradient(110deg,#8a0000,#ff2b2b);border-color:transparent;box-shadow:0 6px 20px rgba(255,43,43,.35)}
.g-out-x{position:absolute;top:10px;left:10px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(255,255,255,.08);
  color:#fff;font-size:16px;line-height:1;cursor:pointer}
.g-out-x:hover{background:rgba(255,43,43,.35)}
@keyframes g-out-in{0%{opacity:0;transform:translateY(24px) scale(.96);filter:blur(6px)}100%{opacity:1;transform:none;filter:none}}
@keyframes g-out-out{to{opacity:0;transform:translateY(16px) scale(.97)}}`;
  document.head.appendChild(style);

  const api = () => (window.pywebview && window.pywebview.api) || null;
  let card = null;

  function close() {
    if (!card) return;
    const c = card;
    card = null;
    c.classList.add('out');
    setTimeout(() => c.remove(), 420);
  }

  async function openReplies(folder) {
    const a = api();
    if (!a || !folder) return;
    const r = await a.list_replies(folder);
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:99999';
    const box = document.createElement('div');
    box.style.cssText = 'background:#11141c;color:#e8e9ee;width:min(980px,94vw);height:min(82vh,720px);display:flex;gap:10px;padding:12px;border-radius:12px;border:1px solid #2a3142';
    const list = document.createElement('div');
    list.style.cssText = 'width:300px;overflow:auto;border-left:1px solid #2a3142;padding-left:8px;font-size:13px';
    const view = document.createElement('pre');
    view.style.cssText = 'flex:1;overflow:auto;white-space:pre-wrap;direction:ltr;text-align:left;font-size:12px;margin:0';
    const items = (r && r.items) || [];
    view.textContent = items.length ? 'یکی از پاسخ‌ها را از فهرست انتخاب کن.' : 'هنوز پاسخی از هوش مصنوعی ذخیره نشده.';
    items.forEach(it => {
      const b = document.createElement('button');
      b.textContent = it.name;
      b.style.cssText = 'display:block;width:100%;text-align:left;margin:3px 0;background:#232a3b;color:#e8e9ee;border:1px solid #2a3142;border-radius:6px;padding:6px;cursor:pointer;direction:ltr;font-size:12px';
      b.onclick = async () => {
        const t = await a.read_reply(it.path);
        view.textContent = t && t.ok ? t.text : ((t && t.error) || 'خطا');
      };
      list.appendChild(b);
    });
    box.appendChild(list);
    box.appendChild(view);
    wrap.appendChild(box);
    wrap.onclick = e => { if (e.target === wrap) wrap.remove(); };
    document.body.appendChild(wrap);
  }

  window.showOutput = function (info) {
    if (!info || !info.path) return;
    close();
    card = document.createElement('div');
    card.className = 'g-out';
    card.innerHTML = `
      <button class="g-out-x" title="بستن">×</button>
      <div class="g-out-head"><img src="" alt=""><div><b></b><small></small></div></div>
      <div class="g-out-path" dir="ltr"></div>
      <div class="g-out-btns">
        <button class="g-out-open"></button>
        <button class="g-out-reveal">نمایش در پوشه</button>
        <button class="g-out-copy">کپی مسیر</button>
      </div>`;
    const mark = document.querySelector('.g-brand img');
    if (mark) card.querySelector('img').src = mark.src;
    card.querySelector('.g-out-open').textContent = info.kind === 'html' ? 'اجرای بازی' : 'باز کردن';
    card.querySelector('b').textContent = info.title || 'خروجی آماده است';
    card.querySelector('small').textContent = info.kind === 'html'
      ? 'فایل تکی؛ با دوبار کلیک و بدون اینترنت اجرا می‌شود' : (info.folder || '');
    card.querySelector('.g-out-path').textContent = info.path;
    card.querySelector('.g-out-x').onclick = close;
    card.querySelector('.g-out-open').onclick = () => api() && api().open_path(info.path);
    card.querySelector('.g-out-reveal').onclick = () => api() && api().reveal_path(info.path);
    card.querySelector('.g-out-copy').onclick = async e => {
      try {
        await navigator.clipboard.writeText(info.path);
        e.target.textContent = 'کپی شد ✓';
      } catch (_) {
        const r = document.createRange();
        r.selectNodeContents(card.querySelector('.g-out-path'));
        getSelection().removeAllRanges();
        getSelection().addRange(r);
      }
    };
    const rb = document.createElement('button');
    rb.className = 'g-out-replies';
    rb.textContent = 'پاسخ‌های AI';
    rb.onclick = () => openReplies(info.folder);
    card.querySelector('.g-out-btns').appendChild(rb);
    document.body.appendChild(card);
    if (window.gBurst) window.gBurst(card.querySelector('.g-out-open'), '#ff3b3b');
  };
})();

</script>
<script>
  (function () {
    const LABELS = { deepseek: 'DeepSeek', chatgpt: 'ChatGPT', gemini: 'Gemini (وب)', claude: 'Claude', qwen: 'Qwen', glm: 'GLM', kimi: 'Kimi', openrouter: 'OpenRouter (API)', gemini_api: 'Gemini (API)' };
    const DEFAULTS = { architect: 'auto', coder: 'auto', reviewer: 'auto', orchestrator: 'auto' };
    document.querySelectorAll('select[name="roleSel"]').forEach((sel) => {
      const role = sel.dataset.role;
      const opts = [['auto', 'خودکار']].concat(Object.entries(LABELS));
      sel.innerHTML = opts.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
      sel.value = DEFAULTS[role] || 'auto';
    });
  })();
</script>
